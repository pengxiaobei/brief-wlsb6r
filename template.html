<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<title>今天 + 本周 · 2026年8月5日</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; }
  h1, h2, h3, h4, p, ul, ol, figure { margin: 0; }
  ul, ol { padding: 0; list-style: none; }
  img { max-width: 100%; display: block; }
  a { color: inherit; }
</style>
</head>
<body>
<style>
  :root {
    --paper:       #FAFBFC;
    --ink:         #0F1418;
    --ink-body:    #333F49;
    --ink-faint:   #7A8792;
    --hair:        #E3E8ED;
    --fill:        #F0F3F6;

    --talk:        #14625E;
    --talk-fill:   #E4F0EE;
    --you:         #A83E10;
    --you-fill:    #FCEBE1;
    --tech:        #35558A;
    --tech-fill:   #E6ECF6;

    --sans: "PingFang SC", "Hiragino Sans GB", "Source Han Sans SC", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper:     #0F1216;
      --ink:       #EAEFF4;
      --ink-body:  #B3BFC9;
      --ink-faint: #75828D;
      --hair:      #232A31;
      --fill:      #191F25;

      --talk:      #5CC0B8;
      --talk-fill: #122E2C;
      --you:       #F2884F;
      --you-fill:  #331B0F;
      --tech:      #8AAEE0;
      --tech-fill: #182233;
    }
  }

  :root[data-theme="dark"] {
    --paper:     #0F1216;
    --ink:       #EAEFF4;
    --ink-body:  #B3BFC9;
    --ink-faint: #75828D;
    --hair:      #232A31;
    --fill:      #191F25;
    --talk:      #5CC0B8;
    --talk-fill: #122E2C;
    --you:       #F2884F;
    --you-fill:  #331B0F;
    --tech:      #8AAEE0;
    --tech-fill: #182233;
  }

  :root[data-theme="light"] {
    --paper:     #FAFBFC;
    --ink:       #0F1418;
    --ink-body:  #333F49;
    --ink-faint: #7A8792;
    --hair:      #E3E8ED;
    --fill:      #F0F3F6;
    --talk:      #14625E;
    --talk-fill: #E4F0EE;
    --you:       #A83E10;
    --you-fill:  #FCEBE1;
    --tech:      #35558A;
    --tech-fill: #E6ECF6;
  }

  body {
    background: var(--paper);
    color: var(--ink-body);
    font-family: var(--sans);
    font-size: 17px;
    line-height: 1.85;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .sheet {
    max-width: 640px;
    margin: 0 auto;
    padding: 44px 22px 100px;
    display: flex;
    flex-direction: column;
  }

  /* ---------- 报头 ---------- */

  .masthead {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .masthead h1 {
    margin: 0;
    font-size: clamp(30px, 8vw, 40px);
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.25;
    color: var(--ink);
  }

  .masthead .date {
    font-size: 15px;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }

  /* 一天跑三轮，打开第一眼要能看到「更新到哪了」 */
  .masthead .updated {
    font-size: 13.5px;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }

  .masthead .updated:empty { display: none; }

  /* ---------- 大区标题 ---------- */

  .part {
    margin-top: 68px;
    display: flex;
    flex-direction: column;
  }

  .part > h2 {
    margin: 0;
    font-size: clamp(26px, 7vw, 32px);
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.01em;
    line-height: 1.3;
  }

  .part > .sub {
    margin: 10px 0 0;
    font-size: 15.5px;
    color: var(--ink-faint);
    line-height: 1.7;
  }

  .part > .sub strong { color: var(--ink-body); font-weight: 600; }

  /* ---------- 今天：五条 ---------- */

  .today {
    list-style: none;
    margin: 40px 0 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 44px;
  }

  .today li {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .label {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    align-self: flex-start;
    padding: 3px 10px;
    border-radius: 3px;
    line-height: 1.6;
  }

  .label.talk { color: var(--talk); background: var(--talk-fill); }
  .label.you  { color: var(--you);  background: var(--you-fill); }
  .label.tech { color: var(--tech); background: var(--tech-fill); }

  .today h3 {
    margin: 0;
    font-size: clamp(21px, 5.4vw, 24px);
    font-weight: 700;
    line-height: 1.5;
    color: var(--ink);
    letter-spacing: -0.005em;
  }

  /* 轮次分界：往下是早先几轮发的，读者上次多半已经看过 */
  .today li.divider {
    flex-direction: row;
    align-items: center;
    gap: 14px;
    margin: 4px 0;
  }

  .today li.divider::before,
  .today li.divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--hair);
  }

  .today li.divider span {
    font-size: 14px;
    color: var(--ink-faint);
    white-space: nowrap;
  }

  .today p {
    margin: 0;
    font-size: 16.5px;
    line-height: 1.85;
    color: var(--ink-body);
  }

  /* 最新一轮的标记。只在当天跑过不止一轮时出现——
     首轮当天页面上不该有任何分段痕迹。 */
  .today li.newmark {
    flex-direction: row;
    align-items: center;
    margin-bottom: -26px;   /* 抵掉一部分 gap，让它贴住下面第一条 */
  }

  .today li.newmark span {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    line-height: 1.6;
    padding: 3px 10px;
    border-radius: 3px;
    color: var(--paper);
    background: var(--you);
    font-variant-numeric: tabular-nums;
  }

  /* 后面几轮补的新进展：原文一个字不改，变化挂在下面。
     放在 .today p 之后 —— 两条选择器权重相同，靠顺序取胜。 */
  .update {
    background: var(--fill);
    border-left: 3px solid var(--you);
    border-radius: 0 3px 3px 0;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .update span {
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--you);
    font-variant-numeric: tabular-nums;
  }

  .update p {
    margin: 0;
    font-size: 16px;
    line-height: 1.8;
    color: var(--ink);
  }

  /* ---------- 本周：趋势 ---------- */

  .trends {
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    gap: 56px;
  }

  .trend {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .trend h3 {
    margin: 0;
    font-size: clamp(23px, 6vw, 27px);
    font-weight: 700;
    line-height: 1.4;
    color: var(--ink);
    letter-spacing: -0.005em;
  }

  /* 阶段条：四段，亮起当前所在的那段 */
  .stage {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 3px;
  }

  .stage i {
    font-style: normal;
    font-size: 12.5px;
    font-weight: 600;
    text-align: center;
    padding: 7px 2px;
    background: var(--fill);
    color: var(--ink-faint);
    line-height: 1.5;
    border-radius: 2px;
  }

  /* 亮起的那段用底色做字，浅色主题下是白字，深色主题下是深字——两边都够对比 */
  .stage i.on { color: var(--paper); }

  .stage.up   i.on { background: var(--talk); }
  .stage.hot  i.on { background: var(--you); }
  .stage.cold i.on { background: var(--tech); }

  .facts {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .facts li {
    font-size: 16.5px;
    line-height: 1.8;
    color: var(--ink-body);
    padding-left: 18px;
    position: relative;
  }

  .facts li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0.82em;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--hair);
  }

  .facts b {
    color: var(--ink);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .verdict {
    background: var(--fill);
    border-radius: 4px;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .verdict::before {
    content: "说人话";
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--ink-faint);
  }

  .verdict p {
    margin: 0;
    font-size: 16.5px;
    line-height: 1.85;
    color: var(--ink);
  }

  .verdict strong { font-weight: 700; }

  /* ---------- 尺子 ---------- */

  .ruler {
    margin-top: 60px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .ruler h3 {
    margin: 0;
    font-size: clamp(22px, 5.6vw, 26px);
    font-weight: 700;
    color: var(--ink);
    line-height: 1.4;
  }

  .ruler p { margin: 0; font-size: 16.5px; line-height: 1.85; }

  .ruler p strong { color: var(--ink); font-weight: 700; }

  .signals {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .signals li {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .signals span {
    font-size: 16.5px;
    color: var(--ink);
    font-weight: 600;
    line-height: 1.6;
  }

  .signals em {
    font-style: normal;
    font-size: 14.5px;
    color: var(--ink-faint);
    line-height: 1.6;
  }

  .signals li:nth-child(-n+2) em { color: var(--talk); }
  .signals li:nth-last-child(-n+2) em { color: var(--you); }

  /* ---------- 说明 ---------- */

  .colophon {
    margin-top: 76px;
    padding-top: 28px;
    border-top: 1px solid var(--hair);
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .colophon h2 {
    margin: 0;
    font-size: 21px;
    font-weight: 700;
    color: var(--ink);
  }

  .colophon p {
    margin: 0;
    font-size: 15.5px;
    line-height: 1.8;
    color: var(--ink-body);
  }

  .colophon p strong { color: var(--ink); font-weight: 700; }

  .src {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    list-style: none;
    margin: 0;
    padding: 0;
    font-size: 13px;
  }

  .src a {
    color: var(--ink-faint);
    text-decoration: none;
    border-bottom: 1px solid var(--hair);
    padding-bottom: 1px;
  }

  .src a:hover,
  .src a:focus-visible { color: var(--talk); border-bottom-color: var(--talk); }

  a:focus-visible { outline: 2px solid var(--talk); outline-offset: 3px; border-radius: 2px; }

  /* 发现服务器上已经跑过新的一轮时浮出来 */
  .refresh {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 10;
    border: 0;
    border-radius: 999px;
    padding: 11px 22px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.4;
    color: var(--paper);
    background: var(--you);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
    cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  @media (max-width: 380px) {
    .stage i { font-size: 11.5px; padding: 6px 1px; }
  }
</style>

<div class="sheet">

  <header class="masthead">
    <h1>今天 + 本周</h1>
    <p class="date"><!--DATE--></p>
    <p class="updated"><!--UPDATED--></p>
  </header>

  <!-- ===================== 今天 ===================== -->
  <section class="part">
    <h2>今天</h2>

    <!--TODAY-->
  </section>

  <!-- ===================== 本周 ===================== -->
  <section class="part">
    <h2>本周：什么在冒头，什么在凉</h2>

    <!--WEEKLY-->
  </section>

  <footer class="colophon">
    <p class="note"><!--NOTE--></p>

    <h2>来源</h2>
    <!--SOURCES-->
  </footer>

</div>

<script>
// 一天跑三轮，但 GitHub Pages 对 HTML 有 10 分钟缓存 ——
// 不主动查的话，17:30 打开很可能拿到的还是 11:30 那一版。
(function () {
  if (location.pathname.indexOf("/archive/") !== -1) return;  // 存档页是死的，不用查

  var built = <!--BUILT-->;   // "<stamp>/<跑过几轮>"，build.py 灌进来
  var shown = false;

  function show() {
    shown = true;
    var b = document.createElement("button");
    b.className = "refresh";
    b.textContent = "有新内容，点这里刷新";
    b.onclick = function () {
      // 带上时间戳绕开缓存，光 reload() 可能还是拿旧的
      location.replace(location.pathname + "?v=" + Date.now());
    };
    document.body.appendChild(b);
  }

  function check() {
    if (shown) return;
    fetch("today.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || shown) return;
        if ((d.stamp || "") + "/" + ((d.runs || []).length) !== built) show();
      })
      .catch(function () {});   // 没网就当无事发生，不要打扰读者
  }

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) check();
  });
  check();
})();
</script>

</body>
</html>
